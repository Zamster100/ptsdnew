<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stats · PTSD Crash</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0f11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Rubik+Glitch&display=swap" rel="stylesheet">
<link rel="icon" href="img/ptsd-logo.webp">
<link rel="stylesheet" href="style.css?v=64">
<style>
  body { min-height: 100svh; }
  .rw-wrap { position: relative; z-index: 1; width: min(860px, 100%); margin: 0 auto; padding: 18px 16px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .rw-ban { border-radius: 24px; padding: 22px 20px 18px; display: flex; align-items: center; gap: 14px; background: radial-gradient(120% 160% at 10% 0%, rgba(80,140,255,.5), transparent 60%), radial-gradient(90% 140% at 100% 100%, rgba(59,227,138,.4), transparent 65%), #0c1018; box-shadow: 0 0 0 2px #27406e, 0 0 38px rgba(80,140,255,.2); }
  .rw-ban h1 { margin: 0; font: 400 38px/1 "Rubik Glitch", Manrope, sans-serif; color: #fff; text-shadow: 0 3px 16px rgba(0,0,0,.55); }
  .rw-ban p { margin: 6px 0 0; color: rgba(255,255,255,.85); font-size: 13px; font-weight: 600; }
  .rw-play { margin-left: auto; text-decoration: none; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.25); color: #fff; font-weight: 800; border-radius: 999px; padding: 10px 18px; white-space: nowrap; }
  .rw-sec { background: linear-gradient(170deg, #17191e, #0a0b0d); border: 1px solid var(--bd); border-radius: 20px; padding: 16px 18px 18px; }
  .rw-sec h2 { margin: 0 0 10px; font: 800 14px Manrope, sans-serif; letter-spacing: .08em; text-transform: uppercase; }
  .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .sk { background: var(--panel2); border: 1px solid var(--bd); border-radius: 12px; padding: 10px 12px; }
  .sk span { display: block; color: var(--mut); font-size: 11px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; }
  .sk b { display: block; margin-top: 4px; font: 800 20px/1.1 Manrope, sans-serif; font-variant-numeric: tabular-nums; }
  .pos { color: #3be38a; } .neg { color: #F05150; } .gold { color: #ffd54a; }
  .trx { display: grid; grid-template-columns: 34px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 4px; border-top: 1px solid #1f2023; }
  .trx:first-of-type { border-top: 0; }
  .trx .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #23262d; font-size: 16px; }
  .trx b { font-weight: 800; } .trx small { display: block; color: var(--mut); font-size: 12px; font-weight: 600; }
  .trx .amt { font-weight: 900; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .trx a { color: inherit; text-decoration: none; }
  .pnl-h { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; } .pnl-h h2 { margin: 0; }
  .seg { margin-left: auto; display: flex; gap: 4px; } .seg button { appearance: none; border: 1px solid var(--bd); background: var(--panel2); color: var(--mut); font: 800 12px Manrope, sans-serif; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .seg button.on { color: #fff; border-color: #F05150; background: #2a1416; }
  .pnl-box { position: relative; } .pnl-box svg { width: 100%; height: auto; display: block; touch-action: none; }
  .pnl-tip { position: absolute; top: 6px; left: 50px; pointer-events: none; font: 800 12px Manrope, sans-serif; background: #0e0f11; border: 1px solid var(--bd); border-radius: 8px; padding: 4px 8px; display: none; white-space: nowrap; }
  .msg { color: var(--mut); text-align: center; padding: 20px; }
  @media (max-width: 560px) { .rw-ban h1 { font-size: 28px; } .rw-ban { flex-wrap: wrap; } }
</style>
</head>
<body>
<header class="dbar">
  <a class="dbar-title" href="./" style="text-decoration:none"><img src="img/ptsd-logo.webp" alt="PTSD"><span>Crash</span></a>
  <div class="dbar-right"><nav class="nv-wrap"><a class="nv" href="./">🎮<span> Play</span></a><a class="nv" href="tasks">🎯<span> Bounties</span></a><a class="nv" href="leaderboard">🏆<span> Leaderboard</span></a><a class="nv on" href="rewards">🏅<span> Rewards</span></a><a class="nv" href="guide">📖<span> Guide</span></a></nav></div>
</header>
<main class="rw-wrap">
  <div class="rw-ban"><div><h1>Stats</h1><p>Your numbers, your last 10 transactions, and how the whole community is doing.</p></div><a class="rw-play" href="./">Back to game</a></div>
  <section class="rw-sec" id="me"><div class="msg">Loading…</div></section>
  <section class="rw-sec" id="com"></section>
  <section class="rw-sec" id="pnl"></section>
  <section class="rw-sec" id="tx"></section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const sgn = (n) => (n > 0 ? "+" : "") + fmt(n);
const cls = (n) => (n > 0 ? "pos" : n < 0 ? "neg" : "");
const get = async (u) => { const r = await fetch(u, { cache: "no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); };
const ICON = { round: "🎮", claim: "🎁", jackpot: "🎫", refund: "🍀" };
const tile = (k, v, c = "") => `<div class="sk"><span>${k}</span><b class="${c}">${v}</b></div>`;
async function load() {
  try {
    const [s, r, t] = await Promise.all([get("api/stats"), get("api/rank").catch(() => ({})), get("api/transactions")]);
    const rate = s.rounds ? Math.round((s.wins / s.rounds) * 100) + "%" : "-";
    const st = s.streak > 0 ? s.streak + "W" : s.streak < 0 ? -s.streak + "L" : "-";
    const lv = r.level;
    $("me").innerHTML = "<h2>Your stats</h2><div class=\"sgrid\">" + [
      lv ? tile("Level", `${lv.n} · ${esc(lv.name)}`) : "", r.rank ? tile("Rank", `#${r.rank} of ${fmt(r.players)}`) : "",
      tile("Net PnL", sgn(s.net), cls(s.net)), tile("Rounds", fmt(s.rounds)), tile("Win rate", rate), tile("Wins", fmt(s.wins), "pos"), tile("Rekt", fmt(s.rekt), s.rekt ? "neg" : ""),
      tile("Wagered", fmt(s.wagered)), tile("Biggest win", s.bestWin ? "+" + fmt(s.bestWin) : "-", "pos"), tile("Best take profit", s.bestMult ? s.bestMult.toFixed(2) + "x" : "-", "gold"),
      tile("Current streak", st, cls(s.streak)), tile("Best win streak", s.bestStreak || "-"),
      s.streaks ? tile("Login streak", s.streaks.login ? s.streaks.login + (s.streaks.login === 1 ? " day" : " days") : "-") : "",
    ].join("") + "</div>";
    $("tx").innerHTML = "<h2>Last 10 transactions</h2>" + (t.transactions.length ? t.transactions.map((x) => {
      const when = new Date(x.ts).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
      return `<div class="trx"><div class="ic">${ICON[x.kind] || "•"}</div><div><b>${esc(x.label)}</b><small>${when}${x.detail ? " · " + esc(x.detail) : ""}</small></div><div class="amt ${cls(x.amount)}">${sgn(x.amount)}</div></div>`;
    }).join("") : "<div class=\"msg\">Nothing yet. Play a round or claim your credits.</div>");
  } catch { $("me").innerHTML = "<div class=\"msg\">Sign in to see your stats.</div>"; $("tx").innerHTML = ""; }
  try {
    const m = (await get("api/rewards")).milestones;
    $("com").innerHTML = m && m.on ? "<h2>Community</h2><div class=\"sgrid\">" + tile("Rounds played by everyone", fmt(m.rounds)) + tile("Players joined", fmt(m.players)) + "</div>" : "";
  } catch { $("com").innerHTML = ""; }
}
let pnlMode = "round", pnlData = null;
function drawPnl() {
  const box = $("pnl");
  if (!pnlData || !pnlData.rows.length) { box.innerHTML = "<h2>PNL</h2><div class=\"msg\">Play a round and your PNL line shows up here.</div>"; return; }
  let pts = []; let run = pnlData.start;
  if (pnlMode === "round") for (const [ts, p] of pnlData.rows) { run += p; pts.push([ts, run]); }
  else {
    const byDay = new Map();
    for (const [ts, p] of pnlData.rows) { const d = new Date(ts); const k = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); byDay.set(k, (byDay.get(k) || 0) + p); }
    for (const k of [...byDay.keys()].sort((a, b) => a - b)) { run += byDay.get(k); pts.push([k, run]); }
  }
  pts.unshift([pts[0][0] - 1, pnlData.start]);
  const W = 800, H = 240, L = 56, R = 12, T = 12, Bm = 26;
  const ys = pts.map((p) => p[1]).concat(0), lo = Math.min(...ys), hi = Math.max(...ys), span = hi - lo || 1;
  const X = (i) => L + (pts.length < 2 ? 0 : (i / (pts.length - 1)) * (W - L - R)), Y = (v) => T + (1 - (v - lo) / span) * (H - T - Bm);
  const end = pts[pts.length - 1][1], col = end >= 0 ? "#3be38a" : "#F05150";
  const line = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[1]).toFixed(1)).join(" ");
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${Y(0).toFixed(1)} L${X(0).toFixed(1)} ${Y(0).toFixed(1)} Z`;
  const dt = (ts) => new Date(ts).toLocaleDateString([], { month: "short", day: "numeric" });
  box.innerHTML = `<div class="pnl-h"><h2>PNL</h2><div class="seg"><button data-m="round" class="${pnlMode === "round" ? "on" : ""}">Per round</button><button data-m="day" class="${pnlMode === "day" ? "on" : ""}">Per day</button></div></div>
    <div class="pnl-box"><svg viewBox="0 0 ${W} ${H}" id="pnlSvg" role="img" aria-label="Cumulative PNL">
      <path d="${area}" fill="${col}" opacity=".12"/><line x1="${L}" x2="${W - R}" y1="${Y(0)}" y2="${Y(0)}" stroke="#5d636d" stroke-dasharray="4 4"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round"/>
      <text x="${L - 6}" y="${Y(hi) + 4}" fill="#9aa4b2" font-size="11" text-anchor="end">${sgn(hi)}</text><text x="${L - 6}" y="${Y(lo) + 4}" fill="#9aa4b2" font-size="11" text-anchor="end">${sgn(lo)}</text>
      <text x="${L}" y="${H - 6}" fill="#9aa4b2" font-size="11">${dt(pts[1][0])}</text><text x="${W - R}" y="${H - 6}" fill="#9aa4b2" font-size="11" text-anchor="end">${dt(pts[pts.length - 1][0])}</text>
      <circle id="pnlDot" r="4" fill="${col}" cx="${X(pts.length - 1)}" cy="${Y(end)}"/></svg><div class="pnl-tip" id="pnlTip"></div></div>
    <div style="color:var(--mut);font-size:12px;font-weight:600;margin-top:6px">Cumulative PNL over your last ${pnlData.rows.length} rounds${pnlData.rows.length >= 400 ? " (older rounds are folded into the starting point)" : ""}. Free claims aren't included.</div>`;
  const svg = $("pnlSvg"), tip = $("pnlTip");
  const move = (e) => {
    const r = svg.getBoundingClientRect(), x = ((e.clientX - r.left) / r.width) * W;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round(((x - L) / (W - L - R)) * (pts.length - 1))));
    $("pnlDot").setAttribute("cx", X(i)); $("pnlDot").setAttribute("cy", Y(pts[i][1]));
    tip.style.display = "block"; tip.style.left = Math.min(r.width - 150, Math.max(0, (X(i) / W) * r.width + 8)) + "px";
    tip.innerHTML = `<span class="${cls(pts[i][1])}">${sgn(pts[i][1])}</span> · ${new Date(pts[i][0]).toLocaleString([], pnlMode === "day" ? { month: "short", day: "numeric" } : { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}`;
  };
  svg.addEventListener("pointermove", move); svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}
document.addEventListener("click", (e) => { const b = e.target.closest(".seg button"); if (b) { pnlMode = b.dataset.m; drawPnl(); } });
async function loadPnl() { try { pnlData = await get("api/pnl"); } catch { pnlData = null; } drawPnl(); }
load(); loadPnl(); setInterval(load, 20000); setInterval(loadPnl, 60000);
</script>
<script src="doublexp.js?v=3"></script>
<script src="jackpot.js?v=2"></script>
<script src="sentiment.js?v=1"></script>
<script src="sidepanel.js?v=6"></script>
<script src="bigwins.js?v=1"></script>
<script type="module" src="usermenu.js"></script>
</body>
</html>
