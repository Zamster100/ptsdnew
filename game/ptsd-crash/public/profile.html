<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--BASE-->
<title>Profile · PTSD Crash</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0f11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Rubik+Glitch&display=swap" rel="stylesheet">
<link rel="icon" href="img/ptsd-logo.webp">
<link rel="stylesheet" href="style.css?v=51">
<style>
  body { min-height: 100svh; }
  .pf { width: min(720px, 100%); margin: 0 auto; padding: 18px 16px 48px; display: flex; flex-direction: column; gap: 14px; }
  .pf-card { --c1: #4a4f57; --c2: #2b2e33; --tx: #9aa1ab; position: relative; border-radius: 22px; padding: 22px 20px; background: linear-gradient(160deg, #15171b, #0b0c0e); border: 2px solid transparent;
    background-clip: padding-box; box-shadow: 0 0 0 2px var(--c1), 0 12px 40px rgba(0,0,0,.45); }
  .pf-card.l1 { --c1: #00D8C6; --c2: #08766e; --tx: #00D8C6; } .pf-card.l2 { --c1: #3b82f6; --c2: #1d3f85; --tx: #6ea3ff; }
  .pf-card.l3 { --c1: #a855f7; --c2: #51227a; --tx: #c58bff; } .pf-card.l4 { --c1: #E8A317; --c2: #7a5208; --tx: #ffc94d; }
  .pf-card.l5 { --c1: #F05150; --c2: #8c1d1d; --tx: #ff8a88; }
  .pf-top { display: flex; align-items: center; gap: 16px; }
  .pf-av { width: 92px; height: 92px; border-radius: 50%; flex: none; overflow: hidden; box-shadow: 0 0 0 4px var(--c1); background: #222; display: flex; align-items: center; justify-content: center; font: 800 42px Manrope, sans-serif; color: #fff; }
  .pf-av img { width: 100%; height: 100%; object-fit: cover; }
  .pf-name { min-width: 0; }
  .pf-name h1 { margin: 0; font: 800 26px/1.1 Manrope, sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pf-name a { color: var(--mut); text-decoration: none; font-weight: 700; font-size: 14px; }
  .pf-badge { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 14px; border-radius: 999px; font: 800 13px Manrope, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #fff; background: linear-gradient(135deg, var(--c1), var(--c2)); }
  .pf-sub { margin-top: 6px; color: var(--tx); font-weight: 800; font-size: 14px; }
  .pf-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .pf-stat { background: var(--panel2); border: 1px solid var(--bd); border-radius: 14px; padding: 12px 10px; text-align: center; }
  .pf-stat b { display: block; font: 800 22px/1.1 Manrope, sans-serif; font-variant-numeric: tabular-nums; }
  .pf-stat span { display: block; margin-top: 4px; font-size: 11px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--mut); }
  .pf-stat b.up { color: var(--up); }
  .pf-share { display: flex; gap: 8px; margin-top: 16px; }
  .pf-share a, .pf-share button { flex: 1; text-align: center; text-decoration: none; border: 0; background: var(--up); color: #fff; font-weight: 800; border-radius: 999px; padding: 12px 14px; box-shadow: 0 3px 0 var(--up-d); font-size: 15px; }
  .pf-share button.alt { background: var(--panel2); color: var(--txt); box-shadow: none; border: 1px solid var(--bd); }
  .pf-sec { background: var(--panel); border: 1px solid var(--bd); border-radius: 18px; padding: 16px; }
  .pf-sec h2 { margin: 0 0 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--mut); }
  .pf-sec p { margin: 0 0 10px; font-size: 14px; line-height: 1.5; }
  .pf-sec p.mut { color: var(--mut); }
  .ladder { display: flex; flex-direction: column; gap: 6px; }
  .rung { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 12px; background: var(--panel2); border: 1px solid var(--bd); opacity: .5; font-weight: 800; font-size: 14px; }
  .rung i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; background: #2b2e33; color: #fff; flex: none; }
  .rung em { margin-left: auto; font-style: normal; color: var(--mut); font-size: 12px; }
  .rung.got { opacity: 1; border-color: var(--up); } .rung.got i { background: var(--up); }
  .rung.now { opacity: 1; border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
  .hist { width: 100%; border-collapse: collapse; font-size: 14px; }
  .hist td { padding: 8px 4px; border-top: 1px solid var(--bd); } .hist td:last-child { text-align: right; font-weight: 800; }
  .own-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-weight: 700; }
  .own-row code { background: var(--panel2); border: 1px solid var(--bd); border-radius: 8px; padding: 4px 8px; font-size: 13px; }
  .own-err { color: var(--down); font-size: 13px; min-height: 16px; margin-top: 6px; }
  .pf-empty { text-align: center; padding: 60px 0; color: var(--mut); }
  @media (max-width: 480px) { .pf-grid { grid-template-columns: repeat(2, 1fr); } .pf-av { width: 72px; height: 72px; font-size: 32px; } .pf-name h1 { font-size: 21px; } }
</style>
</head>
<body>
<header class="dbar">
  <a class="dbar-title" href="./" style="text-decoration:none"><img src="img/ptsd-logo.webp" alt="PTSD"><span>Crash</span></a>
  <div class="dbar-right"><a class="dbar-pill" href="leaderboard" style="text-decoration:none">🏆 Leaderboard</a></div>
</header>
<main class="pf" id="pf"><div class="pf-empty">Loading…</div></main>
<script type="module">
import { renderWalletButtons } from "./wallet.js?v=1";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => Math.round(n).toLocaleString("en-US");
const handle = decodeURIComponent(location.pathname.split("/").pop() || "");
async function api(path, body) {
  const r = await fetch("api/" + path, { method: body ? "POST" : "GET", headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || "Something went wrong, try again."), { status: r.status });
  return j;
}
const avatar = (u) => u.pfp ? `<img src="${esc(u.pfp)}" alt="" referrerpolicy="no-referrer">` : esc((u.username || "?")[0].toUpperCase());
const dateTxt = (ms) => new Date(ms).toLocaleString("en-US", { timeZone: "America/New_York", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + " ET";

let me = null;
async function load() {
  let p;
  try { p = await api("profile/" + encodeURIComponent(handle)); }
  catch { $("pf").innerHTML = `<div class="pf-empty">No player called @${esc(handle)} yet.<br><a href="./" style="color:var(--teal)">Play PTSD Crash</a></div>`; return; }
  document.title = `@${p.user.username} · PTSD Crash`;
  try { me = (await api("me")).user || null; } catch { me = null; }
  const mine = !!(me && me.id === p.user.id);
  const n = p.nft.count, wr = p.rounds ? Math.round((p.wins / p.rounds) * 100) + "%" : "-";
  const cyc = p.cycle ? esc(p.cycle.name) : "This cycle";
  const url = location.origin + location.pathname.replace(/\/$/, "");
  const tweet = `${p.rank ? `I'm #${fmt(p.rank)} on` : "I'm playing"} PTSD Crash${n ? ` as a ${p.nft.badge.name}` : ""}. Gen wealth awaits.`;
  const share = `https://x.com/intent/tweet?text=${encodeURIComponent(tweet)}&url=${encodeURIComponent(url)}`;
  const xl = p.user.x && /^[A-Za-z0-9_]{1,15}$/.test(p.user.username) ? `<a href="https://x.com/${esc(p.user.username)}" target="_blank" rel="noopener noreferrer">@${esc(p.user.username)}</a>` : `<a>@${esc(p.user.username)}</a>`;
  const rungs = p.nft.tiers.map((t) => `<div class="rung ${n >= t.min ? "got" : ""} ${t.level === p.nft.badge.level ? "now" : ""}"><i>${t.level}</i>${esc(t.name)}<em>${t.min}+ Ticket${t.min > 1 ? "s" : ""}</em></div>`).join("");
  const next = p.nft.next ? `Hold <b>${p.nft.next.min}</b> Tickets to reach <b>${esc(p.nft.next.name)}</b>.` : "Top tier reached.";
  const hist = p.history.length ? `<div class="pf-sec"><h2>Past cycles</h2><table class="hist">${p.history.map((h) => `<tr><td>${esc(h.name)}</td><td>${h.rank ? "#" + fmt(h.rank) + " of " + fmt(h.players) : "did not play"}</td><td>${fmt(h.score)}</td></tr>`).join("")}</table></div>` : "";
  $("pf").innerHTML = `
    <div class="pf-card l${p.nft.badge.level}">
      <div class="pf-top"><div class="pf-av">${avatar(p.user)}</div>
        <div class="pf-name"><h1>${esc(p.user.name || p.user.username)}</h1>${xl}<br><span class="pf-badge">${esc(p.nft.badge.name)}</span>
        <div class="pf-sub">${n ? `${n} Ticket${n > 1 ? "s" : ""} held` : "No Tickets yet"}</div></div></div>
      <div class="pf-grid">
        <div class="pf-stat"><b>${p.rank ? "#" + fmt(p.rank) : "-"}</b><span>${cyc} rank</span></div>
        <div class="pf-stat"><b class="${p.score > 0 ? "up" : ""}">${fmt(p.score)}</b><span>Cycle profit</span></div>
        <div class="pf-stat"><b>${fmt(p.rounds)}</b><span>Rounds</span></div>
        <div class="pf-stat"><b>${wr}</b><span>Win rate</span></div>
        <div class="pf-stat"><b>${p.best ? p.best.toFixed(2) + "x" : "-"}</b><span>Best multiplier</span></div>
        <div class="pf-stat"><b>${fmt(p.lifetime.bestStreak)}</b><span>Best win streak</span></div>
      </div>
      ${p.bonus ? `<div class="pf-sub" style="margin-top:12px">Cycle profit includes <b>+${fmt(p.bonus)}</b> from ${fmt(p.referrals)} referral${p.referrals === 1 ? "" : "s"}.</div>` : ""}
      <div class="pf-share"><a href="${share}" target="_blank" rel="noopener noreferrer">Share on X</a><button class="alt" id="copyBtn" type="button">Copy link</button></div>
    </div>
    <div class="pf-sec"><h2>Ticket levels</h2><p class="mut">Hold PTSD Ticket NFTs to level up. Tickets also unlock the NFT bonus: an extra 10k free credits claim, once a day with 1 Ticket, twice with 2, three times with 3 or more.</p><div class="ladder">${rungs}</div><p class="mut" style="margin-top:10px">${next}</p></div>
    ${mine ? `<div class="pf-sec" id="own"></div><div class="pf-sec" id="refs"></div>` : ""}
    ${hist}`;
  $("copyBtn").onclick = async () => { try { await navigator.clipboard.writeText(url); $("copyBtn").textContent = "Copied!"; setTimeout(() => ($("copyBtn").textContent = "Copy link"), 1500); } catch { prompt("Copy this link", url); } };
  if (mine) { ownPanel(); refPanel(); }
}

// Only the owner sees this: referral link, how it pays, and who they brought in.
async function refPanel() {
  const box = $("refs");
  let m;
  try { m = await api("me"); } catch { return; }
  const r = m.ref;
  if (!r) return;
  const link = new URL("./?ref=" + encodeURIComponent(r.code), document.baseURI).href;
  const rows = r.refs.length ? `<table class="hist">${r.refs.map((x) => `<tr><td>@${esc(x.username)}</td><td>${esc(x.status)}</td></tr>`).join("")}</table>` : `<p class="mut">No one has used your code yet.</p>`;
  box.innerHTML = `<h2>Refer friends</h2>
    <p>Each friend who joins with your link gets <b>+${fmt(r.bonus)}</b> bonus credits. When they play at least <b>${r.minRounds}</b> rounds with a real X account, you get <b>+${fmt(r.points)}</b> added to your cycle profit. Up to <b>${r.max}</b> friends.</p>
    <div class="own-row"><code style="overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(link)}</code></div>
    <div class="pf-share"><button id="copyRef" type="button">Copy my link</button><a id="shareRef" target="_blank" rel="noopener noreferrer" href="https://x.com/intent/tweet?text=${encodeURIComponent("Join me on PTSD Crash. Use my link for +" + fmt(r.bonus) + " bonus credits.")}&url=${encodeURIComponent(link)}">Share on X</a></div>
    <p class="mut" style="margin-top:12px"><b>${r.counted}</b> of ${r.max} counted · ${r.pending} still playing</p>${rows}`;
  $("copyRef").onclick = async () => { try { await navigator.clipboard.writeText(link); $("copyRef").textContent = "Copied!"; setTimeout(() => ($("copyRef").textContent = "Copy my link"), 1500); } catch { prompt("Copy this link", link); } };
}

// Only the owner sees this: the wallet link and the claim timer. The address never appears on the public page.
async function ownPanel() {
  const box = $("own");
  let m;
  try { m = await api("me"); } catch { return; }
  const w = m.nft, short = (a) => a.slice(0, 6) + "…" + a.slice(-4);
  const claim = m.onb && m.onb.starter ? (m.onb.canClaim ? "Your free credits are ready to claim in the game." : `Next free claim: ${dateTxt(m.onb.claimAt)}.`) : "";
  if (!w || !w.enabled) { box.innerHTML = `<h2>Your account</h2><p class="mut">${claim}</p>`; return; }
  if (w.address) {
    const swap = w.canSwapAt && w.canSwapAt > Date.now() ? `You can switch wallets after ${dateTxt(w.canSwapAt)}.` : "You can switch to another wallet any time.";
    box.innerHTML = `<h2>Your wallet</h2><div class="own-row">Linked <code>${esc(short(w.address))}</code> · ${w.count} Ticket${w.count === 1 ? "" : "s"}${w.bonusHours ? ` · NFT bonus every ${w.bonusHours}h` : ""}</div>
      <p class="mut" style="margin-top:10px">Only your Ticket count is public, never your address. ${swap} ${claim}</p>
      <div class="pf-share"><button class="alt" id="recheck" type="button">Re-check my Tickets</button></div><div class="own-err" id="ownErr"></div>`;
    $("recheck").onclick = async () => { $("recheck").disabled = true; try { await api("wallet/refresh", {}); } catch (e) { $("ownErr").textContent = e.message; } load(); };
    if (!(w.canSwapAt && w.canSwapAt > Date.now())) {
      box.insertAdjacentHTML("beforeend", `<p class="mut" style="margin-top:12px">Switch to a different wallet:</p><div class="wl-list" id="own-wl"></div>`);
      renderWalletButtons($("own-wl"), { api, onError: (t) => ($("ownErr").textContent = t), onDone: () => load() });
    }
    return;
  }
  box.innerHTML = `<h2>Connect your wallet</h2><p>Optional. <b>For NFT boosts, connect a wallet holding PTSD Ticket NFTs.</b> You only sign a message, it's free.</p><div class="wl-list" id="own-wl"></div><div class="own-err" id="ownErr"></div><p class="mut" style="margin-top:8px">${claim}</p>`;
  renderWalletButtons($("own-wl"), { api, onError: (t) => ($("ownErr").textContent = t), onDone: () => load() });
}
load();
</script>
</body>
</html>
